name: clipbot
on:
  schedule:
    - cron: "7 * * * *"      # ทุกชั่วโมง (เวลา UTC)
  workflow_dispatch:          # กดรันเองได้
concurrency:
  group: clipbot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 poll.py
      - name: Save stats
        run: |
          git config user.name "clipbot"
          git config user.email "clipbot@users.noreply.github.com"
          git add stats.db
          git diff --cached --quiet || (git commit -m "update stats" && git push)
